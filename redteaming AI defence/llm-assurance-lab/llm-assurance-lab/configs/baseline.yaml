# Baseline profile: the assistant as a typical first version would ship it.
# No guardrails, no access control, secrets in the system prompt.
profile: baseline

llm:
  provider: ollama            # ollama | openai | anthropic | simulated
  model: llama3.2:3b
  base_url: http://localhost:11434
  temperature: 0.0
  max_tokens: 400
  timeout_s: 120

data:
  knowledge_base_dir: data/knowledge_base
  untrusted_sources_dir: data/untrusted_sources   # threat model: partner feed is attacker controllable
  customers_file: data/customers.json

retrieval:
  top_k: 3
  chunk_max_chars: 700
  enforce_access_control: false     # internal documents are retrievable by customers

security:
  hardened_prompt: false            # plain prompt, retrieved text not marked as untrusted
  authorize_customer_lookup: false  # lookup tool returns any customer the user mentions
  sanitize_untrusted_context: false
  input_classifier:
    enabled: false
    model_path: models/guardrail.joblib
    screen_retrieved_chunks: false
  output_filter:
    enabled: false
    allowed_domains: [havenkade.example]

judge:
  enabled: false                    # set true to score jailbreaks with an LLM judge
  provider: ollama
  model: llama3.2:3b
