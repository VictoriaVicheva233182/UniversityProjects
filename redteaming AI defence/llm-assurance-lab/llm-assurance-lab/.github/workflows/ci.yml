name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q --cov=assurance_lab --cov-report=term-missing
      - name: Smoke test full engagement (simulated model)
        run: assurance-lab all --provider simulated --no-converters
      - name: Upload sample report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: simulated-report
          path: reports/
