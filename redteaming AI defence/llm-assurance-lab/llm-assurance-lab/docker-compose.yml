# docker compose up --build
# Then open http://localhost:8000. The first start downloads the model (about 2 GB).
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${ASSURANCE_LLM_MODEL:-llama3.2:3b}"]
    restart: "no"

  api:
    build: .
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      ASSURANCE_LLM_PROVIDER: ollama
      ASSURANCE_LLM_MODEL: ${ASSURANCE_LLM_MODEL:-llama3.2:3b}
      ASSURANCE_LLM_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"

volumes:
  ollama:
