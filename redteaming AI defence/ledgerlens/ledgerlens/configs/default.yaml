# LedgerLens settings. Environment variables (LEDGERLENS_LLM_MODEL etc.) override these.
company: Noordkade Logistics B.V.
financial_year: 2025

data:
  seed: 11            # 7 was used to develop the method, 11 is the fresh test ledger
  scale: 1.0            # 1.0 is about 200,000 journal entries; use 0.2 for a quick run
  output_dir: output

detection:
  approval_limit_eur: 10000
  top_k: [25, 50, 100, 200, 500, 1000]
  isolation_forest_trees: 300
  autoencoder_epochs: 40

llm:
  provider: ollama      # ollama | openai | anthropic | simulated
  model: llama3.1:8b
  base_url: http://localhost:11434
  temperature: 0.0
  max_tokens: 900
  timeout_s: 180

copilot:
  top_n: 15             # how many of the highest ranked entries the copilot investigates
  max_steps: 6          # tool calls per investigation
